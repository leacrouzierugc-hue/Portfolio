function updateHistoryUI(){$('#undo-btn').innerHTML=icon('undo');$('#redo-btn').innerHTML=icon('redo');$('#undo-btn').disabled=historyIndex===0;$('#redo-btn').disabled=historyIndex===history.length-1}
function commit(message,rerender=true){finishEditing(false);history=history.slice(0,historyIndex+1);history.push(clone(doc));if(history.length>65)history.shift();historyIndex=history.length-1;dirty=true;updateHistoryUI();if(rerender)render();scheduleSave();if(message)say(message)}
function restore(index){if(index<0||index>=history.length)return;finishEditing(false);historyIndex=index;doc=clone(history[index]);if(!doc.pages.some(p=>p.id===pageId))pageId=doc.pages[0].id;selection=selection.filter(id=>find(id));dirty=true;render();scheduleSave()}
function applyProp(prop,value,source){
 if(prop.startsWith('setting.')){doc.settings[prop.slice(8)]=String(value);commit();return}
 if(prop.startsWith('page.')){const k=prop.slice(5),p=page();if(k.startsWith('name.'))p.name[k.slice(5)]=String(value);else if(['width','height'].includes(k))p[k]=Math.max(k==='height'?200:600,Math.min(k==='height'?12000:2400,Number(value)||p[k]));else p[k]=value;commit();return}
 const es=chosen();if(!es.length)return;const nums=['x','y','w','h','fontSize','rotation','opacity','radius','lineHeight','tracking','strokeWidth','columns','gap','positionX','positionY','speed','cellSize'];if(nums.includes(prop)){value=Number(value);if(!Number.isFinite(value))return;if(prop==='opacity')value=Math.max(0,Math.min(100,value))/100;if(['w','h'].includes(prop))value=Math.max(5,value);if(prop==='fontSize')value=Math.max(6,Math.min(240,value));if(prop==='columns')value=Math.max(1,Math.min(6,Math.round(value)));}
 if(es.length>1&&['x','y','w','h'].includes(prop)){const b=currentBounds();if(prop==='x'||prop==='y'){const d=value-b[prop];es.forEach(e=>e[prop]+=d)}else{const f=value/b[prop];es.forEach(e=>{if(prop==='w'){e.x=b.x+(e.x-b.x)*f;e.w*=f}else{e.y=b.y+(e.y-b.y)*f;e.h*=f}})}}
 else for(const e of es){if(['text','label','alt'].includes(prop)){e[prop]=e[prop]&&typeof e[prop]==='object'?e[prop]:pair('');e[prop][lang]=String(value);if(prop==='text')e.name[lang]=String(value).slice(0,38)}else if(prop==='name')e.name=pair(String(value));else if(prop==='href'||prop==='url')e[prop]=safeUrl(value);else e[prop]=value;}
 commit();
}
function newElement(type,opts={}){const p=page(),base={id:uid(),type,name:pair({text:'Text',image:'Photo',video:'Video',document:'Document',shape:'Shape',gallery:'Gallery',button:'Button'}[type],{text:'Texte',image:'Photo',video:'Vidéo',document:'Document',shape:'Forme',gallery:'Galerie',button:'Bouton'}[type]),x:Math.round((p.width-360)/2),y:Math.max(55,Math.min(p.height-200,Math.round(($('#workspace').scrollTop+120)/scale))),w:360,h:200,rotation:0,opacity:1,hidden:false,locked:false,role:type,font:doc.settings.visual==='digital'?'modern':'sans',fontSize:22,color:doc.settings.visual==='digital'?'#f6f0f4':'#2b2426',...opts};return base}
function addElement(type,opts={}){finishEditing();const e=newElement(type,opts);page().elements.push(e);selection=[e.id];commit();return e}
function deleteSelection(ids=selection){finishEditing();const set=new Set(ids);if(!set.size)return;page().elements=page().elements.filter(e=>!set.has(e.id));selection=selection.filter(id=>!set.has(id));commit('Sélection supprimée · Annuler pour la rétablir.')}
function duplicateSelection(){const es=chosen();if(!es.length)return;const gm={};const ns=es.map(e=>{const x=clone(e);x.id=uid();x.x+=24;x.y+=24;x.locked=false;x.name=pair(t(e.name)+' copy',fr(e.name)+' copie');if(x.group){gm[x.group]??=uid();x.group=gm[x.group];doc.groups[x.group]={...doc.groups[e.group],name:(doc.groups[e.group]?.name||'Groupe')+' copie'}}return x});page().elements.push(...ns);selection=ns.map(e=>e.id);commit('Copie créée.')}
function makeGroup(){const es=chosen();if(es.length<2){say('Sélectionne plusieurs éléments avec Maj + clic.');return}const id=uid();doc.groups[id]={name:'Groupe '+Object.keys(doc.groups).length,mobile:'flow'};es.forEach(e=>e.group=id);commit('Éléments groupés. Double-clique sur un texte pour l’éditer.')}
function ungroup(){const ids=new Set(chosen().map(e=>e.group).filter(Boolean));page().elements.forEach(e=>{if(ids.has(e.group))delete e.group});commit('Groupe séparé : chaque objet peut maintenant bouger seul.')}
function reorderSelection(mode){const p=page(),s=new Set(selection);if(mode==='front'||mode==='back'){const yes=p.elements.filter(e=>s.has(e.id)),no=p.elements.filter(e=>!s.has(e.id));p.elements=mode==='front'?[...no,...yes]:[...yes,...no]}else if(mode==='forward'){for(let i=p.elements.length-2;i>=0;i--)if(s.has(p.elements[i].id)&&!s.has(p.elements[i+1].id))[p.elements[i],p.elements[i+1]]=[p.elements[i+1],p.elements[i]]}else{for(let i=1;i<p.elements.length;i++)if(s.has(p.elements[i].id)&&!s.has(p.elements[i-1].id))[p.elements[i],p.elements[i-1]]=[p.elements[i-1],p.elements[i]]}commit()}
function alignSelection(kind){const es=chosen().filter(e=>!e.locked);if(!es.length)return;const b=es.length>1?currentBounds(es):{x:0,y:0,w:page().width,h:page().height};for(const e of es){if(kind==='left')e.x=b.x;if(kind==='center')e.x=b.x+(b.w-e.w)/2;if(kind==='right')e.x=b.x+b.w-e.w;if(kind==='top')e.y=b.y;if(kind==='middle')e.y=b.y+(b.h-e.h)/2;if(kind==='bottom')e.y=b.y+b.h-e.h}commit()}
function toggleSelection(prop){const es=chosen(),value=!es.every(e=>e[prop]);es.forEach(e=>e[prop]=value);commit()}
function addPage(){const p={id:'section-'+uid(),name:pair('New section','Nouvelle section'),kind:'main',width:1200,height:850,background:doc.settings.visual==='digital'?'#160f16':'#f5f0e8',elements:[]};doc.pages.push(p);pageId=p.id;selection=[];tab='pages';commit('Section vide créée. Ajoute uniquement ce dont tu as besoin.')}
function duplicatePage(){const p=clone(page()),gm={};p.id='section-'+uid();p.name=pair(p.name.en+' copy',p.name.fr+' copie');p.elements.forEach(e=>{e.id=uid();if(e.group){const old=e.group;gm[old]??=uid();e.group=gm[old];doc.groups[e.group]=clone(doc.groups[old]||{name:'Groupe',mobile:'flow'})}});doc.pages.splice(doc.pages.indexOf(page())+1,0,p);pageId=p.id;selection=[];commit('Section dupliquée.')}
function finishEditing(save=true){if(!editing)return;const id=editing,n=$('.stage [data-id="'+id+'"]'),e=find(id);editing=null;if(n){n.removeAttribute('contenteditable');n.blur()}if(e&&n){const value=n.innerText??n.textContent;if(value!==t(e.text)){e.text[lang]=value;e.name[lang]=value.slice(0,38);if(save)commit(null,false)}}if(save){renderSelection();renderInspector();renderContext()}}
function startEditing(id){finishEditing();const e=find(id);if(!e||e.type!=='text'||e.locked)return;groupBypass=true;setSelection([id],{keepGroup:true});groupBypass=false;editing=id;const n=$('.stage [data-id="'+id+'"]');n.setAttribute('contenteditable','true');n.setAttribute('spellcheck',lang==='fr'?'true':'true');n.lang=lang;n.focus();const r=document.createRange();r.selectNodeContents(n);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);renderSelection()}

function startUpload(kind='auto',replaceId=null,point=null,append=false){uploadMode={kind,replaceId,point,append};const i=$('#upload-input');i.accept=kind==='image'||kind==='gallery'?'image/jpeg,image/png,image/webp,image/gif,image/avif':kind==='video'?'video/mp4,video/webm,video/ogg,video/quicktime':kind==='document'?'.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip,.pages,.key,.numbers,.odt,.odp':'*/*';i.multiple=kind==='gallery'||!replaceId;i.value='';i.click()}
function fileKind(file){const ext=file.name.toLowerCase().split('.').pop();if(['jpg','jpeg','png','webp','gif','avif'].includes(ext)||/image\/(jpeg|png|webp|gif|avif)/.test(file.type))return 'image';if(['mp4','webm','ogg','mov','m4v'].includes(ext)||/^video\//.test(file.type))return 'video';return 'document'}
async function putAsset(file){if(file.size>100*1024*1024)throw new Error('Le fichier dépasse 100 Mo. Utilise plutôt un lien pour une grande vidéo.');const ext=file.name.toLowerCase().split('.').pop();if(['html','htm','svg','js','mjs','exe','sh','bat'].includes(ext))throw new Error('Choisis une photo, une vidéo ou un document PDF / bureautique.');let type=file.type||'';if(ext==='pdf'){const sig=new TextDecoder().decode(await file.slice(0,5).arrayBuffer());if(sig!=='%PDF-')throw new Error('Ce fichier ne semble pas être un PDF valide.');type='application/pdf'}else if(fileKind(file)==='document')type='application/octet-stream';else if(fileKind(file)==='image')type=({'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','gif':'image/gif','webp':'image/webp','avif':'image/avif'}[ext]||file.type);const id=uid(),blob=file.slice(0,file.size,type);assets.set(id,{name:file.name,type,size:file.size,blob});doc.assets[id]={name:file.name,type,size:file.size};return id}
async function imageSize(id){try{const img=new Image();img.src=assetUrl(id);await img.decode();return{w:img.naturalWidth,h:img.naturalHeight}}catch{return{w:4,h:3}}}
async function importFiles(files,mode={kind:'auto'},point){const list=Array.from(files||[]);if(!list.length)return;finishEditing();document.body.classList.add('busy');$('#save-status').textContent='Préparation…';try{
 const ids=[];for(const f of list){const kind=fileKind(f);if((mode.kind==='image'||mode.kind==='gallery')&&kind!=='image')throw new Error('Choisis uniquement des photos pour cet élément.');if(mode.kind==='video'&&kind!=='video')throw new Error('Choisis un fichier vidéo, ou utilise « Depuis un lien ».');ids.push(await putAsset(f))}
 const target=mode.replaceId?find(mode.replaceId):null;
 if(target){if(target.type==='gallery'){target.assets=mode.append?[...(target.assets||[]),...ids]:ids}else{target.asset=ids[0];target.url='';if(target.type==='image')target.emptyInvisible=false}selection=[target.id]}
 else if(mode.kind==='gallery'){const e=newElement('gallery',{assets:ids,columns:Math.min(3,ids.length),gap:8,w:650,h:420,...(point||mode.point||{})});page().elements.push(e);selection=[e.id]}
 else{const added=[];for(let j=0;j<ids.length;j++){const id=ids[j],a=assets.get(id),kind=fileKind(list[j]);let wh=kind==='image'?{w:420,h:315}:kind==='video'?{w:560,h:315}:{w:460,h:80};if(kind==='image'){const sz=await imageSize(id);wh.h=Math.max(100,Math.min(570,420*sz.h/sz.w))}const e=newElement(kind,{asset:id,name:pair(a.name),...wh,fit:'cover',positionX:50,positionY:50,fill:kind==='image'?undefined:'#551c32',color:'#fffbf6',label:pair(a.name),url:'',radius:0,preview:false});const pt=point||mode.point;if(pt){e.x=pt.x+j*25;e.y=pt.y+j*25}else{e.x+=j*25;e.y+=j*25}page().elements.push(e);added.push(e.id)}selection=added}
 commit(list.length===1?'Fichier ajouté. Déplace-le où tu veux.':list.length+' fichiers ajoutés.');
 }catch(e){say(e.message||'Ce fichier n’a pas pu être ajouté.')}finally{document.body.classList.remove('busy');$('#save-status').textContent=dirty?'Modifications en cours':'Prêt'} }
function blobBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)})}
function usedAssets(d=doc){const set=new Set();for(const p of d.pages)for(const e of p.elements){if(e.asset)set.add(e.asset);if(e.poster)set.add(e.poster);for(const id of e.assets||[])set.add(id)}return set}
async function packAssets(d=doc){const out={};for(const id of usedAssets(d)){const a=assets.get(id);if(a)out[id]={name:a.name,type:a.type,size:a.size,data:await blobBase64(a.blob)}}return out}
async function openDB(){if(db)return db;if(!window.indexedDB)throw new Error('Storage unavailable');db=await new Promise((res,rej)=>{const q=indexedDB.open('lea-portfolio-studio',1);q.onupgradeneeded=()=>q.result.createObjectStore('documents');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});return db}
function dbGet(){return openDB().then(d=>new Promise((res,rej)=>{const r=d.transaction('documents').objectStore('documents').get(doc.id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function autosave(){if(writing){scheduleSave();return}writing=true;try{const d=await openDB(),data=clone(doc),assetData={};data.savedAt=Date.now();for(const id of usedAssets()){const a=assets.get(id);if(a)assetData[id]={name:a.name,type:a.type,size:a.size,blob:a.blob}}await new Promise((res,rej)=>{const tx=d.transaction('documents','readwrite');tx.objectStore('documents').put({doc:data,assets:assetData},doc.id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});$('#save-status').textContent='Sauvegardé ici';}catch{$('#save-status').textContent='À enregistrer en HTML';}finally{writing=false}}
function scheduleSave(){$('#save-status').textContent='Modifications…';clearTimeout(saveTimer);saveTimer=setTimeout(autosave,700)}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function scriptJSON(v){return JSON.stringify(v).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}
async function exportHTML(visitor=false){document.activeElement?.blur?.();finishEditing();closeModal();say('Préparation du fichier complet…');try{const d=clone(doc);d.savedAt=Date.now();if(visitor){d.pages.forEach(p=>p.elements=p.elements.filter(e=>!e.hidden));const ids=usedAssets(d);for(const id of Object.keys(d.assets))if(!ids.has(id))delete d.assets[id]}
 const a=await packAssets(d),root=document.documentElement.cloneNode(true);root.dataset.export=visitor?'visitor':'editor';root.lang=d.settings.language||'en';root.querySelector('#editor').setAttribute('hidden','');root.querySelector('#public-view').setAttribute('hidden','');root.querySelector('#editor').classList.remove('active-props');root.querySelector('#stage').replaceChildren();root.querySelector('#selection-ui').replaceChildren();root.querySelector('#left-panel').replaceChildren();root.querySelector('#inspector').replaceChildren();root.querySelector('#contextbar').replaceChildren();root.querySelector('#public-view').replaceChildren();root.querySelector('#case-content').replaceChildren();root.querySelector('#modal-content').replaceChildren();root.querySelector('#toast').setAttribute('hidden','');root.querySelector('#back-editor').setAttribute('hidden','');root.querySelectorAll('dialog').forEach(n=>n.removeAttribute('open'));root.querySelector('#studio-document').textContent=scriptJSON(d);root.querySelector('#studio-assets').textContent=scriptJSON(a);root.querySelector('title').textContent=d.title;root.querySelector('body').className='';const content='<!doctype html>\n'+root.outerHTML;download(new Blob([content],{type:'text/html;charset=utf-8'}),visitor?'Lea_Crouzier_Portfolio_Visiteurs.html':'Lea_Crouzier_Portfolio_Modifiable.html');dirty=false;$('#save-status').textContent='HTML enregistré';say(visitor?'Version visiteurs téléchargée.':'HTML modifiable téléchargé, avec tes fichiers et les deux langues.');}catch(e){say('Enregistrement impossible : '+e.message)}}
function showSave(){finishEditing();openModal(modalHead('Garde ta dernière version.')+'<p>Le fichier HTML contient la mise en page, les textes anglais et français et les fichiers importés. Enregistre-le après tes modifications.</p><button class="save-option" data-action="export-edit">'+icon('save')+'<span><b>HTML modifiable</b><small>Ton fichier de travail. Ouvre-le pour continuer à tout modifier.</small></span></button><button class="save-option" data-action="export-visitor">'+icon('download')+'<span><b>HTML pour les visiteurs</b><small>Le portfolio s’ouvre directement, avec les liens, les vidéos et les documents. Prêt à héberger.</small></span></button><button class="save-option" data-action="export-json">'+icon('file')+'<span><b>Sauvegarde complète (.json)</b><small>Une copie de secours à réimporter dans cet éditeur.</small></span></button><button class="save-option" data-action="import">'+icon('import')+'<span><b>Reprendre un fichier existant</b><small>Importer un HTML modifiable ou une sauvegarde JSON. Le document ouvert sera remplacé après confirmation.</small></span></button><p class="prop-small">La sauvegarde du navigateur est un secours local. Le téléchargement HTML permet de conserver et déplacer ton travail.</p>')}
function pointerPoint(ev){const r=$('#canvas-wrap').getBoundingClientRect();return{x:(ev.clientX-r.left)/scale,y:(ev.clientY-r.top)/scale}}
function syncMoved(){for(const e of chosen()){const n=$('.stage [data-id="'+e.id+'"]');if(n)styleElement(n,e)}renderSelection()}
function beginDrag(ev,handle=null){if(ev.button!==0||view||editing)return;const es=chosen().filter(e=>!e.locked);if(!es.length)return;ev.preventDefault();const b=currentBounds(es);drag={pointer:ev.pointerId,start:{x:ev.clientX,y:ev.clientY},elements:es.map(clone),bounds:b,handle,moved:false};document.addEventListener('pointermove',moveDrag);document.addEventListener('pointerup',endDrag,{once:true});document.addEventListener('pointercancel',endDrag,{once:true})}
function snapDelta(b,dx,dy,ids){const others=page().elements.filter(e=>!ids.includes(e.id)&&!e.hidden);const xs=[0,page().width/2,page().width],ys=[0,page().height/2,page().height];for(const e of others){xs.push(e.x,e.x+e.w/2,e.x+e.w);ys.push(e.y,e.y+e.h/2,e.y+e.h)}let sx=dx,sy=dy,gx=null,gy=null,mx=6/scale,my=6/scale;for(const x of [b.x,b.x+b.w/2,b.x+b.w])for(const target of xs){const dist=target-(x+dx);if(Math.abs(dist)<mx){mx=Math.abs(dist);sx=dx+dist;gx=target}}for(const y of [b.y,b.y+b.h/2,b.y+b.h])for(const target of ys){const dist=target-(y+dy);if(Math.abs(dist)<my){my=Math.abs(dist);sy=dy+dist;gy=target}}const xv=$('#guide-x'),yv=$('#guide-y');xv.hidden=gx===null;yv.hidden=gy===null;if(gx!==null)xv.style.left=gx*scale+'px';if(gy!==null)yv.style.top=gy*scale+'px';return{x:sx,y:sy}}
function moveDrag(ev){if(!drag||ev.pointerId!==drag.pointer)return;const dx=(ev.clientX-drag.start.x)/scale,dy=(ev.clientY-drag.start.y)/scale;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;if(!drag.moved)return;
 if(!drag.handle){const d=ev.altKey?{x:dx,y:dy}:snapDelta(drag.bounds,dx,dy,drag.elements.map(e=>e.id));if(ev.altKey){$('#guide-x').hidden=true;$('#guide-y').hidden=true}for(const old of drag.elements){const e=find(old.id);e.x=Math.round((old.x+d.x)*10)/10;e.y=Math.round((old.y+d.y)*10)/10}}
 else{const h=drag.handle,b=drag.bounds;let ndx=dx,ndy=dy,angle=0;if(drag.elements.length===1){angle=(drag.elements[0].rotation||0)*Math.PI/180;ndx=dx*Math.cos(angle)+dy*Math.sin(angle);ndy=-dx*Math.sin(angle)+dy*Math.cos(angle)}let l=-b.w/2,r=b.w/2,top=-b.h/2,bt=b.h/2;if(h.includes('e'))r=Math.max(l+10,r+ndx);if(h.includes('w'))l=Math.min(r-10,l+ndx);if(h.includes('s'))bt=Math.max(top+10,bt+ndy);if(h.includes('n'))top=Math.min(bt-10,top+ndy);if(ev.shiftKey&&h.length===2){const ratio=b.w/b.h;if((r-l)/(bt-top)>ratio){if(h.includes('s'))bt=top+(r-l)/ratio;else top=bt-(r-l)/ratio}else{if(h.includes('e'))r=l+(bt-top)*ratio;else l=r-(bt-top)*ratio}}
 const nw=r-l,nh=bt-top,cx=(l+r)/2,cy=(top+bt)/2,nx=b.x+b.w/2+cx*Math.cos(angle)-cy*Math.sin(angle)-nw/2,ny=b.y+b.h/2+cx*Math.sin(angle)+cy*Math.cos(angle)-nh/2;
 for(const old of drag.elements){const e=find(old.id);e.x=nx+(old.x-b.x)*nw/b.w;e.y=ny+(old.y-b.y)*nh/b.h;e.w=Math.max(10,old.w*nw/b.w);e.h=Math.max(10,old.h*nh/b.h);if(drag.elements.length>1&&['text','button'].includes(e.type))e.fontSize=Math.max(6,old.fontSize*nw/b.w)}
 }
 syncMoved();
}
function endDrag(){if(!drag)return;const moved=drag.moved;drag=null;document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointerup',endDrag);document.removeEventListener('pointercancel',endDrag);$('#guide-x').hidden=true;$('#guide-y').hidden=true;if(moved)commit(null,false);renderInspector();renderContext();if(tab==='layers')renderPanel()}
function makePublicSection(p){const section=document.createElement('section');section.className='public-section';section.id=p.id;section.style.background=p.background;section.dataset.pageId=p.id;const canvas=document.createElement('div');canvas.className='public-canvas';canvas.dataset.visual=doc.settings.visual||'editorial';canvas.style.width=p.width+'px';canvas.style.height=p.height+'px';const buckets=new Map(),members=p.elements.filter(e=>!e.hidden);for(const e of members){if(e.group){if(!buckets.has(e.group))buckets.set(e.group,[]);buckets.get(e.group).push(e)}}const made=new Set();
 for(const e of members){if(!e.group){const node=buildElement(e,true);node.style.zIndex=p.elements.indexOf(e)+1;canvas.append(node);continue}if(made.has(e.group))continue;made.add(e.group);const es=buckets.get(e.group),wrapper=document.createElement('div'),inner=document.createElement('div');wrapper.className='mobile-group';wrapper.dataset.group=e.group;inner.className='mobile-inner';if(doc.groups[e.group]?.mobile==='art'){wrapper.classList.add('mobile-art');const bounds=currentBounds(es);wrapper.dataset.artWidth=bounds.w;wrapper.dataset.artHeight=bounds.h;inner.style.width=bounds.w+'px';inner.style.height=bounds.h+'px';for(const a of es){const n=buildElement(a,true);n.style.zIndex=p.elements.indexOf(a)+1;n.dataset.desktopX=a.x;n.dataset.desktopY=a.y;n.dataset.localX=a.x-bounds.x;n.dataset.localY=a.y-bounds.y;inner.append(n)}}else for(const a of [...es].sort((a,b)=>a.y-b.y||a.x-b.x)){const node=buildElement(a,true);node.style.zIndex=p.elements.indexOf(a)+1;inner.append(node);}wrapper.append(inner);canvas.append(wrapper)}
 // Mobile follows the vertical placement chosen in the editor; desktop preserves the exact layer order.

$('#left-panel').addEventListener('dragstart',ev=>{const n=ev.target.closest('[data-layer],[data-page]');if(!n)return;reorderDrag={kind:n.dataset.layer?'layer':'page',id:n.dataset.layer||n.dataset.page};ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',reorderDrag.id)});
$('#left-panel').addEventListener('dragover',ev=>{const n=ev.target.closest('[data-layer],[data-page]');if(!n||!reorderDrag)return;ev.preventDefault();$$('.drag-over').forEach(a=>a.classList.remove('drag-over'));n.classList.add('drag-over')});
$('#left-panel').addEventListener('dragend',()=>{reorderDrag=null;$$('.drag-over').forEach(a=>a.classList.remove('drag-over'))});
$('#left-panel').addEventListener('drop',ev=>{const target=ev.target.closest('[data-layer],[data-page]');if(!target||!reorderDrag)return;ev.preventDefault();const {kind,id}=reorderDrag;const targetId=kind==='layer'?target.dataset.layer:target.dataset.page;if(id!==targetId){const arr=kind==='layer'?page().elements:doc.pages,from=arr.findIndex(x=>x.id===id),to=arr.findIndex(x=>x.id===targetId);if(from>=0&&to>=0){const [item]=arr.splice(from,1);arr.splice(to,0,item);commit()}}reorderDrag=null;$$('.drag-over').forEach(a=>a.classList.remove('drag-over'))});
document.addEventListener('keydown',ev=>{
 const target=ev.target,input=target.matches('input,textarea,select,[contenteditable=true]'),mod=ev.ctrlKey||ev.metaKey;
 if(ev.key==='Escape'){if(editing){finishEditing();ev.preventDefault()}else if(view&&document.documentElement.dataset.export!=='visitor')backEditor();else setSelection([]);return}
 if(mod&&ev.key.toLowerCase()==='s'&&!view){ev.preventDefault();exportHTML();return}if(view||input||$('#modal').open)return;
 if(mod&&ev.key.toLowerCase()==='z'){ev.preventDefault();restore(historyIndex+(ev.shiftKey?1:-1));return}if(mod&&ev.key.toLowerCase()==='y'){ev.preventDefault();restore(historyIndex+1);return}
 if(mod&&ev.key.toLowerCase()==='d'){ev.preventDefault();duplicateSelection();return}if(mod&&ev.key.toLowerCase()==='a'){ev.preventDefault();setSelection(page().elements.filter(e=>!e.hidden).map(e=>e.id),{keepGroup:true});return}
 if(mod&&ev.key.toLowerCase()==='g'){ev.preventDefault();ev.shiftKey?ungroup():makeGroup();return}
 if(mod&&ev.key.toLowerCase()==='c'&&selection.length){internalClipboard=clone(chosen());ev.preventDefault();return}if(mod&&ev.key.toLowerCase()==='v'&&internalClipboard){ev.preventDefault();const groupMap={};const ns=clone(internalClipboard);for(const e of ns){e.id=uid();e.x+=24;e.y+=24;e.locked=false;if(e.group){const old=e.group;groupMap[old]??=uid();e.group=groupMap[old];doc.groups[e.group]={...(doc.groups[old]||{}),name:'Groupe collé'}}}page().elements.push(...ns);selection=ns.map(e=>e.id);commit('Éléments collés.');return}
 if(['Delete','Backspace'].includes(ev.key)&&selection.length){ev.preventDefault();deleteSelection();return}
 if(ev.key.startsWith('Arrow')&&selection.length){ev.preventDefault();const d=ev.shiftKey?10:1;for(const e of chosen().filter(x=>!x.locked)){if(ev.key==='ArrowLeft')e.x-=d;if(ev.key==='ArrowRight')e.x+=d;if(ev.key==='ArrowUp')e.y-=d;if(ev.key==='ArrowDown')e.y+=d}commit(null,false);syncMoved();renderInspector();return}
 if(ev.key==='Enter'&&chosen().length===1&&chosen()[0].type==='text'){ev.preventDefault();startEditing(selection[0])}
});
